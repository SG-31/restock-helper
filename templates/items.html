<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>管理品目一覧</title>
</head>

<body>   
    <h1>管理品目一覧</h1>
    
    <p><a href="/">トップに戻る</a></p>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    {% if items %}
    <table border="1">
        <tr>
            <th>品目名</th>
            <th>単位</th>
            <th>現在庫</th>
            <th>操作</th>
        </tr>

        {% for item in items %}
        <tr>
            <td>{{ item['name'] }}</td>
            <td>{{ item['unit'] }}</td>
            <td>{{ item['current_stock'] }}</td>
            <td>
                <a href="/items/{{ item['id'] }}/edit">変更</a>

                <form method="POST" action="/items/{{ item['id'] }}/delete" style="display:inline"
                    onsubmit="return confirm('削除すると、この品目の過去の消費量データも消えます。よろしいですか？');">
                    <button type="submit">削除</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p>管理品目は登録されていません。</p>
    {% endif %}

    <p>
        <a href="/items/new">管理品目を登録</a>
    </p>

</body>

</html>
