<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理品目</title>
</head>

<body>
    <p><a href="/">トップに戻る</a></p>

    {% if item or is_edit %}
    <h1>管理品目編集</h1>
    {% else %}
    <h1>管理品目登録</h1>
    {% endif %}

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}


    {% if not load_error %}
    <form method="POST" action="{{ action_url }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="name">品目名</label>
            <input type="text" id="name" name="name"
                value="{{ form_data['name'] if form_data else (item['name'] if item else '') }}" maxlength="100"
                required>
        </div>

        <div>
            <label for="unit">単位</label>
            <input type="text" id="unit" name="unit"
                value="{{ form_data['unit'] if form_data else (item['unit'] if item else '') }}" maxlength="100"
                required>
        </div>

        <div>
            <label for="current_stock">
                {% if item %}
                現在庫数
                {% else %}
                初期在庫数
                {% endif %}
            </label>
            <input type="number" id="current_stock" name="current_stock"
                value="{{ form_data['current_stock'] if form_data else (item['current_stock'] if item else '') }}"
                min="0" max="9999" required>
        </div>

        {% if item %}
        <button type="submit">変更</button>
        {% else %}
        <button type="submit">登録</button>
        {% endif %}

    </form>
    {% endif %}

</body>

</html>
