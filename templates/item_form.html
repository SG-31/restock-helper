<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>管理品目</title>
</head>
<body>

    {% if item %}
        <h1>管理品目編集</h1>
    {% else %}
        <h1>管理品目登録</h1>
    {% endif %}

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <form method="POST" action="{{ action_url }}">

        <div>
            <label for="name">品目名</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ item['name'] if item else '' }}"
                required
            >
        </div>

        <div>
            <label for="unit">単位</label>
            <input
                type="text"
                id="unit"
                name="unit"
                value="{{ item['unit'] if item else '' }}"
                required
            >
        </div>

        <div>
            <label for="current_stock">初期在庫数</label>
            <input
                type="number"
                id="current_stock"
                name="current_stock"
                value="{{ item['current_stock'] if item else '' }}"
                required
            >
        </div>

        {% if item %}
            <button type="submit">変更</button>
        {% else %}
            <button type="submit">登録</button>
        {% endif %}

    </form>

</body>
</html>
